name: macos

on: [push, pull_request]

jobs:
  build_macos:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15-intel
          arch: x86_64
        # Upstream GCC has no aarch64-apple-darwin target, Aspectator carries
        # the same out-of-tree patch that Homebrew applies to build GCC on
        # Apple Silicon.
        - runner: macos-15
          arch: arm64

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Download GCC dependencies
      run: |
        cd aspectator
        ./contrib/download_prerequisites

    - name: Build CIF
      run: make -j $(sysctl -n hw.ncpu)
      env:
        ASPECTATOR_CONFIGURE_OPTS: --disable-bootstrap
        CC: gcc-14
        CXX: g++-14

    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Test CIF
      run: |
        python -m pip install --upgrade pytest
        make test

    - name: Archive CIF
      run: tar -cJf $(inst/bin/cif --version).tar.xz -C inst .

    - name: Upload CIF
      uses: actions/upload-artifact@v7
      with:
        name: macos-${{ matrix.arch }}-cif
        path: "*.tar.xz"
